[package]
name = "tauri-app"
version = "0.3.0"
description = "Offline Bible study and sermon preparation"
authors = ["Colt McClish"]
edition = "2021"
# The build tools under `src/bin/` make this crate produce more than one
# binary; without this, `cargo run` (used by `tauri dev`/`tauri build`) can't
# tell which one to launch and refuses to start.
default-run = "tauri-app"

# The build tools, declared so they can be kept out of the app. Tauri's CLI
# bundles every binary it finds under `src/bin/` into the installer -- a
# 26 MB `build_content_db.exe` shipped beside the app until these were gated
# behind a feature `tauri build` never enables. Run them with
# `--features tools` (the npm scripts do); a plain `cargo build` skips them,
# which also spares five LTO links on every app build.
[[bin]]
name = "build_content_db"
path = "src/bin/build_content_db.rs"
required-features = ["tools"]

[[bin]]
name = "build_library_pack"
path = "src/bin/build_library_pack.rs"
required-features = ["tools"]

[[bin]]
name = "collect_library"
path = "src/bin/collect_library.rs"
required-features = ["tools"]

[[bin]]
name = "import_epub_library"
path = "src/bin/import_epub_library.rs"
required-features = ["tools"]

[[bin]]
name = "check_topics"
path = "src/bin/check_topics.rs"
required-features = ["tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Remembers window size, position, and maximized state between launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "functions" registers `html_text()` on the connection: the search triggers
# call it so the indexes hold a note's words rather than its markup.
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
quick-xml = "0.36"
roxmltree = "0.20"
sha2 = "0.10"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1"
# Random, unguessable tokens standing in for the file paths a dialog chose
# (see `commands::file_picker`).
uuid = { version = "1", features = ["v4"] }
zip = "8.6.0"
pdf-extract = "0.12.0"
# Already in the tree through pdf-extract; named here for reading a PDF's
# Info dictionary (title and author) when a file is added to Resources.
lopdf = "0.42"
# Title and artist tags of audio and video files, for the same purpose.
lofty = "0.22"
mobi = "0.8.0"
regex = "1"
# Accent- and point-insensitive Greek and Hebrew: a lemma, a search term, or a
# lexicon headword compared by its bare letters (see `crate::plain`). Already
# in the tree through url/idna.
unicode-normalization = "0.1"
# The one HTTP client in the app, for the one request it makes: the update
# check in `crate::update`, which only ever runs when a reader presses the
# button in Settings → About. Blocking and small on purpose -- a single GET
# behind a `spawn_blocking` needs no async runtime of its own, and `reqwest`
# would pull one in for nothing.
ureq = "3"
# Comparing the running version against a release tag. Already in the tree as
# a dependency of tauri's own; declared here so `crate::update` can say
# `0.10.0 > 0.9.0`, which no string comparison gets right.
semver = "1"
# The offline neural voice. `default-features = false` drops the espeak-ng
# fallback and the CMake build that comes with it, leaving the crate's own
# bundled Misaki dictionary: permissively licensed, no C toolchain to install,
# and nothing fetched at run time -- the model ships in the installer.
kokoro-en = { version = "0.1", default-features = false }

# Reads the Windows accent color from the registry (Settings → Reading →
# "Accent color: Windows accent", F3.8).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"


# What tells a built app to serve the frontend from inside itself rather than
# from the dev server. `tauri build` passes it; without the feature declared
# here, that command fails outright and a plain `cargo build --release`
# quietly produces a binary whose window opens on "localhost refused to
# connect" -- which is what every release build of this app did until now.
[features]
custom-protocol = ["tauri/custom-protocol"]
# Enables the `src/bin/` build tools (see the `[[bin]]` entries above). Adds
# nothing to the library itself.
tools = []

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: `resources::extract_text` runs pdf-extract over files
# the reader chose, and pdf-extract panics on some malformed input. Aborting
# took the whole app down with it and lost unsaved work; unwinding lets that
# one extraction be caught and the file added unindexed.
panic = "unwind"
strip = true
