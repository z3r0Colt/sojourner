[package]
name = "sojourner-core"
version = "0.4.2"
description = "Sojourner's database, queries and pure helpers, shared by the desktop app and the web build"
authors = ["Colt McClish"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "functions" registers `html_text()` on the connection: the search triggers
# call it so the indexes hold a note's words rather than its markup.
rusqlite = { version = "0.40", features = ["functions"] }
quick-xml = "0.36"
roxmltree = "0.20"
sha2 = "0.10"
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
once_cell = "1"
regex = "1"
# Accent- and point-insensitive Greek and Hebrew (see `plain`).
unicode-normalization = "0.1"

# SQLite itself: compiled into the binary on the desktop. On wasm32 rusqlite
# links `sqlite-wasm-rs` instead (SQLite compiled to WebAssembly), which the
# web crate configures.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
